<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#121A2B">
<title>ルーレットでえらぶ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#101A2C;
    --bg-deep:#0B1220;
    --paper:#FBF6EC;
    --gold:#D8A93B;
    --gold-soft:#E8C878;
    --red:#C0392B;
    --ink:#20242F;
    --ink-light:#EFE8D8;
    --muted:#8B93A8;
    --line: rgba(216,169,59,0.25);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0; padding:0; height:100%;}
  body{
    background:
      radial-gradient(circle at 50% -10%, #1B2A45 0%, var(--bg) 45%, var(--bg-deep) 100%);
    color:var(--ink-light);
    font-family:'Zen Kaku Gothic New', sans-serif;
    min-height:100vh;
    padding: max(24px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(32px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
    display:flex;
    justify-content:center;
    user-select:none;
    -webkit-user-select:none;
  }
  .app{ width:100%; max-width:420px; display:flex; flex-direction:column; align-items:center; }

  header{ text-align:center; margin-bottom:18px; }
  h1{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:900;
    font-size:26px;
    letter-spacing:.02em;
    margin:0 0 6px;
    color:var(--ink-light);
  }
  header p{ margin:0; font-size:13px; color:var(--muted); }

  .wheel-wrap{
    position:relative;
    width:300px; height:300px;
    margin: 6px 0 22px;
    filter: drop-shadow(0 14px 30px rgba(0,0,0,0.45));
  }
  .wheel-ring{
    position:absolute; inset:-10px;
    border-radius:50%;
    background: conic-gradient(from 0deg, var(--gold-soft), var(--gold) 25%, var(--gold-soft) 50%, var(--gold) 75%, var(--gold-soft));
    padding:10px;
  }
  .wheel-ring::after{
    content:""; position:absolute; inset:10px; border-radius:50%; background:var(--bg-deep);
  }
  #wheel{
    position:relative; z-index:1;
    display:block;
    border-radius:50%;
    background:var(--paper);
    transform: rotate(0deg);
    transition: transform 4.4s cubic-bezier(0.15,0.62,0.14,1);
  }
  .hub{
    position:absolute; top:50%; left:50%; width:34px; height:34px;
    transform:translate(-50%,-50%);
    background: radial-gradient(circle at 35% 30%, var(--gold-soft), var(--gold) 60%, #a97e22 100%);
    border-radius:50%; z-index:3;
    box-shadow: 0 2px 6px rgba(0,0,0,0.4);
  }
  .pointer{
    position:absolute; top:-6px; left:50%; transform:translateX(-50%);
    width:0; height:0; z-index:4;
    border-left:14px solid transparent;
    border-right:14px solid transparent;
    border-top:24px solid var(--red);
    filter: drop-shadow(0 2px 3px rgba(0,0,0,0.5));
  }
  .pointer::after{
    content:""; position:absolute; top:-24px; left:-6px;
    width:0; height:0;
    border-left:6px solid transparent;
    border-right:6px solid transparent;
    border-top:10px solid var(--gold-soft);
  }

  .spin-btn{
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:19px;
    color:var(--ink);
    background: linear-gradient(180deg, var(--gold-soft), var(--gold));
    border:none;
    border-radius:999px;
    padding:14px 48px;
    letter-spacing:.05em;
    box-shadow: 0 6px 0 #a97e22, 0 10px 18px rgba(0,0,0,0.35);
    transition: transform .08s ease, box-shadow .08s ease, opacity .2s ease;
  }
  .spin-btn:active{ transform: translateY(4px); box-shadow: 0 2px 0 #a97e22, 0 4px 10px rgba(0,0,0,0.3); }
  .spin-btn:disabled{ opacity:.4; box-shadow:none; transform:none; }

  .result-banner{
    margin-top:18px;
    width:100%;
    text-align:center;
    background: var(--red);
    color:var(--ink-light);
    border-radius:14px;
    padding:14px 16px;
    font-family:'Zen Maru Gothic', sans-serif;
    font-weight:700;
    font-size:17px;
    box-shadow: 0 8px 18px rgba(192,57,43,0.35);
    opacity:1;
    transform: translateY(0);
    transition: opacity .3s ease, transform .3s ease;
  }
  .result-banner .label{ display:block; font-size:11px; font-weight:500; color:var(--gold-soft); margin-bottom:4px; letter-spacing:.08em; }
  .result-banner.hidden{ opacity:0; transform: translateY(-6px); height:0; padding:0; margin-top:0; overflow:hidden; }

  section.choices{ width:100%; margin-top:26px; }
  .choices h2{
    font-family:'Zen Maru Gothic', sans-serif;
    font-size:14px; font-weight:700; color:var(--gold-soft);
    margin:0 0 10px; letter-spacing:.04em;
  }
  .choice-list{ display:flex; flex-direction:column; gap:8px; }
  .choice-row{
    display:flex; align-items:center; gap:8px;
    background: rgba(255,255,255,0.04);
    border:1px solid var(--line);
    border-radius:10px;
    padding:4px 4px 4px 12px;
  }
  .choice-row .swatch{
    width:9px; height:9px; border-radius:50%; flex-shrink:0;
  }
  .choice-row input{
    flex:1;
    background:transparent;
    border:none;
    outline:none;
    color:var(--ink-light);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-size:15px;
    padding:10px 4px;
    min-width:0;
  }
  .choice-row input::placeholder{ color:var(--muted); }
  .choice-row input:focus-visible{ outline:2px solid var(--gold-soft); outline-offset:2px; border-radius:6px; }
  .remove-btn{
    width:30px; height:30px; flex-shrink:0;
    border:none; border-radius:50%;
    background:rgba(255,255,255,0.06);
    color:var(--muted);
    font-size:16px; line-height:1;
    display:flex; align-items:center; justify-content:center;
  }
  .remove-btn:disabled{ opacity:.25; }
  .remove-btn:focus-visible{ outline:2px solid var(--gold-soft); }

  .add-btn{
    width:100%; margin-top:12px;
    padding:12px;
    border-radius:10px;
    border:1.5px dashed var(--line);
    background:transparent;
    color:var(--gold-soft);
    font-family:'Zen Kaku Gothic New', sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .add-btn:disabled{ opacity:.3; }
  .add-btn:focus-visible{ outline:2px solid var(--gold-soft); }

  .count-note{ text-align:center; font-size:12px; color:var(--muted); margin-top:10px; }

  @media (prefers-reduced-motion: reduce){
    #wheel{ transition: transform .8s ease-out; }
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <h1>ルーレットでえらぶ</h1>
    <p>選択肢を入れてスピンすると、ひとつだけ選ばれます</p>
  </header>

  <div class="wheel-wrap">
    <div class="wheel-ring"></div>
    <canvas id="wheel" width="300" height="300"></canvas>
    <div class="hub"></div>
    <div class="pointer"></div>
  </div>

  <button id="spinBtn" class="spin-btn">スピン</button>

  <div id="resultBanner" class="result-banner hidden" aria-live="polite">
    <span class="label">けっか</span>
    <span id="resultText"></span>
  </div>

  <section class="choices">
    <h2>選択肢（2〜10個）</h2>
    <div id="choiceList" class="choice-list"></div>
    <button id="addBtn" class="add-btn">＋ 選択肢を追加</button>
    <p class="count-note" id="countNote"></p>
  </section>
</div>

<script>
(function(){
  const PALETTE = ['#C0392B','#3E6259','#D8A93B','#4C6FA5','#8B5E83','#C97B4A','#5C8A72','#9C4F4F','#3E5C76','#B98D3E'];
  const MIN_N = 2, MAX_N = 10;

  let choices = ['', ''];
  let currentRotation = 0;
  let spinning = false;

  const canvas = document.getElementById('wheel');
  const ctx = canvas.getContext('2d');
  const spinBtn = document.getElementById('spinBtn');
  const addBtn = document.getElementById('addBtn');
  const choiceListEl = document.getElementById('choiceList');
  const countNote = document.getElementById('countNote');
  const resultBanner = document.getElementById('resultBanner');
  const resultText = document.getElementById('resultText');

  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function truncate(str, maxChars){
    if(str.length <= maxChars) return str;
    return str.slice(0, maxChars - 1) + '…';
  }

  function drawWheel(){
    const n = choices.length;
    const cx = 150, cy = 150, radius = 145;
    ctx.clearRect(0,0,300,300);

    const segDeg = 360 / n;
    const maxChars = n <= 4 ? 11 : n <= 6 ? 8 : n <= 8 ? 6 : 5;
    const fontSize = n <= 4 ? 18 : n <= 6 ? 16 : n <= 8 ? 14 : 12;

    for(let i=0; i<n; i++){
      const startDeg = -90 + i*segDeg;
      const start = startDeg * Math.PI/180;
      const end = (startDeg+segDeg) * Math.PI/180;

      ctx.beginPath();
      ctx.moveTo(cx,cy);
      ctx.arc(cx,cy,radius,start,end);
      ctx.closePath();
      ctx.fillStyle = PALETTE[i % PALETTE.length];
      ctx.fill();
      ctx.lineWidth = 2;
      ctx.strokeStyle = 'rgba(251,246,236,0.85)';
      ctx.stroke();

      const label = choices[i] && choices[i].trim() ? truncate(choices[i].trim(), maxChars) : '';
      if(label){
        ctx.save();
        ctx.translate(cx,cy);
        ctx.rotate(start + (end-start)/2);
        ctx.textAlign = 'right';
        ctx.textBaseline = 'middle';
        ctx.font = `600 ${fontSize}px 'Zen Kaku Gothic New', sans-serif`;
        ctx.lineWidth = 3;
        ctx.strokeStyle = 'rgba(0,0,0,0.32)';
        ctx.strokeText(label, radius-16, 0);
        ctx.fillStyle = '#FBF6EC';
        ctx.fillText(label, radius-16, 0);
        ctx.restore();
      }
    }
  }

  function renderChoiceList(){
    choiceListEl.innerHTML = '';
    choices.forEach((val, i) => {
      const row = document.createElement('div');
      row.className = 'choice-row';

      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.background = PALETTE[i % PALETTE.length];
      row.appendChild(swatch);

      const input = document.createElement('input');
      input.type = 'text';
      input.placeholder = `選択肢 ${i+1}`;
      input.value = val;
      input.setAttribute('aria-label', `選択肢${i+1}`);
      input.maxLength = 20;
      input.addEventListener('input', (e)=>{
        choices[i] = e.target.value;
        drawWheel();
        updateValidity();
      });
      row.appendChild(input);

      const removeBtn = document.createElement('button');
      removeBtn.className = 'remove-btn';
      removeBtn.textContent = '×';
      removeBtn.setAttribute('aria-label', `選択肢${i+1}を削除`);
      removeBtn.disabled = choices.length <= MIN_N;
      removeBtn.addEventListener('click', ()=>{
        if(choices.length <= MIN_N) return;
        choices.splice(i,1);
        renderChoiceList();
        drawWheel();
        updateValidity();
      });
      row.appendChild(removeBtn);

      choiceListEl.appendChild(row);
    });

    addBtn.disabled = choices.length >= MAX_N;
    countNote.textContent = `${choices.length} / ${MAX_N} 個`;
  }

  function updateValidity(){
    const filled = choices.every(c => c.trim() !== '');
    spinBtn.disabled = !filled || choices.length < MIN_N || spinning;
  }

  function mod(n, m){ return ((n % m) + m) % m; }

  function spin(){
    if(spinning) return;
    const n = choices.length;
    if(choices.some(c => c.trim()==='') || n < MIN_N) return;

    spinning = true;
    spinBtn.disabled = true;
    resultBanner.classList.add('hidden');

    const winnerIndex = Math.floor(Math.random() * n);
    const segDeg = 360 / n;
    const requiredMod = mod(-(segDeg/2 + winnerIndex*segDeg), 360);
    const margin = Math.min(10, segDeg*0.22);
    const jitter = (Math.random()-0.5) * Math.max(0, segDeg - 2*margin);
    const targetMod = mod(requiredMod + jitter, 360);

    const extraSpins = reduceMotion ? 1 : (6 + Math.floor(Math.random()*3));
    const delta = mod(targetMod - mod(currentRotation,360), 360) + 360*extraSpins;
    const newRotation = currentRotation + delta;

    canvas.style.transform = `rotate(${newRotation}deg)`;

    const onEnd = () => {
      canvas.removeEventListener('transitionend', onEnd);
      currentRotation = newRotation;
      spinning = false;
      updateValidity();
      resultText.textContent = choices[winnerIndex].trim();
      resultBanner.classList.remove('hidden');
    };
    canvas.addEventListener('transitionend', onEnd);
  }

  addBtn.addEventListener('click', ()=>{
    if(choices.length >= MAX_N) return;
    choices.push('');
    renderChoiceList();
    drawWheel();
    updateValidity();
  });

  spinBtn.addEventListener('click', spin);

  renderChoiceList();
  drawWheel();
  updateValidity();
})();
</script>
</body>
</html>
